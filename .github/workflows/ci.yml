# SPDX-License-Identifier: Apache-2.0
# Every check a merge depends on. The ruleset on main requires `checks`, the aggregate at the
# bottom, and also `secret scan` and `tree guards` by name, so a branch that deletes either
# job from this file cannot leave `checks` green with the guard gone.
#
# Pull requests get the Linux leg alone: one macOS runner minute draws roughly ten Linux minutes
# from the quota, so `go` adds its macOS leg only for the weekly schedule, a manual dispatch and a
# published release. a5 section 3.4 names `macos-latest` beside `ubuntu-latest` without saying
# when; this is that reconciliation.
#
# Each step prints an examined count and fails when it is zero, since a step that looked at nothing
# proves nothing. Each outside action is named by its full commit, with its tag noted after it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Cancel only on pull requests, where a newer push makes the old run moot; a scheduled or release
  # run is the sole witness of what it tested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(contains(fromJSON('["pull_request","push"]'), github.event_name) && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go vet
        run: |
          set -euo pipefail
          go version
          packages=$(go list ./... | wc -l | tr -d ' ')
          echo "examined=$packages packages"
          [ "$packages" -gt 0 ] || { echo "::error::go vet examined 0 packages" >&2; exit 1; }
          go vet ./...

      - name: go test
        run: |
          set -euo pipefail
          rc=0
          go test -v ./... > "$RUNNER_TEMP/test.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/test.log"
          passed=$(grep -cE '^ *--- PASS: ' "$RUNNER_TEMP/test.log" || true)
          failed=$(grep -cE '^ *--- FAIL: ' "$RUNNER_TEMP/test.log" || true)
          echo "examined=$((passed + failed)) tests, passed=$passed, failed=$failed"
          [ "$rc" -eq 0 ] || exit "$rc"
          [ "$passed" -gt 0 ] || { echo "::error::go test ran 0 tests" >&2; exit 1; }

      - name: go build
        run: |
          set -euo pipefail
          go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/foliot" ./cmd/foliot
          out=$("$RUNNER_TEMP/foliot")
          echo "$out"
          echo "examined=1 binaries, $(wc -c < "$RUNNER_TEMP/foliot" | tr -d ' ') bytes"
          case "$out" in
            "foliot "*) ;;
            *) echo "::error::the built binary did not print its version" >&2; exit 1 ;;
          esac

  tree-guards:
    name: tree guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The proof first: a check that cannot go red on a planted string guards nothing.
      - name: The guards fail on planted strings
        run: sh scripts/tree-guard-test.sh
      - name: No fork identifier in the tree
        run: sh scripts/tree-guard.sh .guard/fork-identifiers
      - name: No former product name in the tree
        run: sh scripts/tree-guard.sh .guard/former-name

  lane-guard:
    name: linux lane guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The lane itself is a workstation tool and CI already reads Linux directly, so what runs
      # here is the proof that the lane can go red. A lane nobody can see rot is a lane that
      # quietly stops catching the thing it was built for.
      - name: The lane goes red on a platform assumption, and refuses when it cannot read Linux
        run: sh scripts/linux-lane-test.sh

  secret-scan:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a token removed by a later commit stays readable in the earlier one.
          fetch-depth: 0
      # Fetched from the release page and checked by hash; no outside action touches the checkout.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        run: |
          set -uo pipefail
          [ "$(git rev-parse --is-shallow-repository)" = false ] || { echo "::error::shallow checkout" >&2; exit 1; }
          # gitleaks exits 0 after "0 commits scanned" when it cannot read the repository, so the
          # count it prints is the evidence, not its exit code.
          rc=0
          out=$("$RUNNER_TEMP/gitleaks" git . --no-banner --no-color --redact --log-level info 2>&1) || rc=$?
          printf '%s\n' "$out"
          scanned=$(printf '%s\n' "$out" | sed -n 's/.*[^0-9]\([0-9][0-9]*\) commits scanned\..*/\1/p' | tail -1)
          echo "examined=${scanned:-0} commits"
          [ "${scanned:-0}" -gt 0 ] || { echo "::error::gitleaks scanned 0 commits" >&2; exit 1; }
          case $rc in
            0) ;;
            1) echo "::error::gitleaks found secrets; rotate the credential first, rewriting history does not un-leak it" >&2; exit 1 ;;
            *) echo "::error::gitleaks exited $rc" >&2; exit 1 ;;
          esac

  # `checks` is what the ruleset requires. It runs under `if: always()`: skipped behind a failed
  # dependency, it would read to the ruleset as neither pass nor fail, and this one has to fail.
  checks:
    name: checks
    if: always()
    needs: [go, tree-guards, secret-scan, lane-guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "examined=$(echo "$RESULTS" | wc -w | tr -d ' ') jobs: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::a required job reported '$result'" >&2; exit 1; }
          done
